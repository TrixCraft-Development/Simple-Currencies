# Display name of this currency
name: "Default Currency"

# Command that will be registered for this currency
command: "default"

# Should this currency support decimals?
decimals: false

# Can players pay each other using this currency?
pay-enabled: true

# Withdraw currency into a physical item (banknote)
# Placeholders for display-name and lore: %amount%, %currency%, %player%
withdraw:
  enabled: false
  item: "PAPER"
  display-name: "&a%amount% %currency%"
  lore:
    - "&7Value: &e%amount% %currency%"
    - "&7Withdrawn by: &f%player%"
    - "&7Right-click to redeem"

# Balance new players start with
start-balance: 0

# Maximum balance for players (<= 0 means unlimited)
max-balance: 0

# Custom maximum balances by permission
# If a player has multiple permissions, the highest value wins
max-balance-permissions:
  simplecurrencies.maxbalance.premium: 10000

# Worlds where this currency is disabled
# Commands and balance changes should be blocked there
disabled-worlds:
  - example_world

# Exchange rates when transferring this currency to another currency
# Format: <target_currency_id>: <rate> (1 unit of this currency = <rate> units of target currency)
exchange-rates: {}

# Automatically import/transfer balances into this currency on an interval
auto-import:
  enabled: false
  # Source to import from ("Vault" or another SimpleCurrencies currency ID)
  source: "Vault"
  # Interval in seconds (or duration string like "1m", "60s", "5m")
  interval: 60
  # Exchange rate (1 source unit = <rate> of this currency)
  rate: 1.0
  # Delete/clear balances from the source (Vault or source currency) after transferring
  clear-source: true
  # Log a console message when balances are transferred
  log-console: true

balances:
  00000000-0000-0000-0000-000000000000:
    name: "Player"
    balance: 0